name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      github_environment:
        required: false
        type: string
      override_version:
        required: false
        type: string
        default: ''
    secrets:
      docker-user:
        required: true
      docker-pass:
        required: true
      docker-repo:
        required: true
      github-token:
        required: true
      vps-host:
        required: true
      vps-username:
        required: true
      vps-ssh-private-key:
        required: true
      APP_SECRETS:
        required: true

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    name: Deploy da aplicação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Read config.json for the selected environment
        id: json_config
        run: |
          ENV_NAME=${{ inputs.environment }}
          echo "Reading configuration for environment: $ENV_NAME"
          
          CONFIG_PATH="infra/$ENV_NAME/config.json"
          
          sudo apt-get update && sudo apt-get install -y jq
          APP_NAME=$(jq -r '.nameAPP' "$CONFIG_PATH")
          APP_PORT=$(jq -r '.port' "$CONFIG_PATH")
          
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "APP_PORT=${APP_PORT}" >> $GITHUB_OUTPUT
          
          echo "Application name: $APP_NAME"
          echo "Application port: $APP_PORT"

      - name: Extract Release Version for Deploy
        id: versioning
        env:
          DOCKER_USER: ${{ secrets.docker-user }}
          DOCKER_PASS: ${{ secrets.docker-pass }}
          DOCKER_REPO: ${{ secrets.docker-repo }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          
          OVERRIDE_VER="${{ inputs.override_version }}"
          
          # 1. Obter a versão do pom.xml
          POM_VER=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null || python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('pom.xml'); root = tree.getroot(); ns = {'m': 'http://maven.apache.org/POM/4.0.0'}; print(root.find('m:version', ns).text if root.find('m:version', ns) is not None else '')")
          echo "Versão no pom.xml: $POM_VER"
          
          # 2. Obter do histórico do git
          GIT_VER=$(git log -n 5 --oneline 2>/dev/null | grep -oE 'release/1\.0\.[0-9]+|1\.0\.[0-9]+' | head -n1 | sed 's|release/||' || true)
          echo "Versão no histórico do Git: $GIT_VER"
          
          # 3. Buscar a última tag 1.0.X no Docker Hub
          APP_NAME="${{ steps.json_config.outputs.APP_NAME }}"
          LOGIN_RES=$(curl -s -H "Content-Type: application/json" -X POST -d "{\"username\": \"${DOCKER_USER}\", \"password\": \"${DOCKER_PASS}\"}" https://hub.docker.com/v2/users/login/)
          TOKEN=$(echo "$LOGIN_RES" | jq -r '.token // empty')
          
          HIGHEST_DOCKER_TAG=""
          HIGHEST_PATCH=0
          
          if [ -n "$TOKEN" ]; then
            TAGS_JSON=$(curl -s -H "Authorization: JWT ${TOKEN}" "https://hub.docker.com/v2/repositories/${DOCKER_REPO}/${APP_NAME}/tags?page_size=100")
            TAGS=$(echo "$TAGS_JSON" | jq -r '.results[]?.name // empty')
          
            for tag in $TAGS; do
              if [[ "$tag" =~ ^1\.0\.([0-9]+)$ ]]; then
                PATCH_NUM="${BASH_REMATCH[1]}"
                if (( PATCH_NUM > HIGHEST_PATCH )); then
                  HIGHEST_PATCH=$PATCH_NUM
                  HIGHEST_DOCKER_TAG="1.0.${PATCH_NUM}"
                fi
              fi
            done
          fi
          echo "Última tag publicada no Docker Hub: $HIGHEST_DOCKER_TAG"
          
          # Seleção final da versão
          if [ -n "$OVERRIDE_VER" ]; then
            APP_VERSION="${OVERRIDE_VER#v}"
            echo "Aviso: Utilizando versão sob demanda/rollback: $APP_VERSION"
          elif [[ "$POM_VER" =~ ^1\.0\.[0-9]+$ ]]; then
            APP_VERSION="$POM_VER"
          elif [[ "$GIT_VER" =~ ^1\.0\.[0-9]+$ ]]; then
            APP_VERSION="$GIT_VER"
          elif [ -n "$HIGHEST_DOCKER_TAG" ]; then
            APP_VERSION="$HIGHEST_DOCKER_TAG"
          else
            echo "❌ Não foi possível determinar uma versão válida de release!"
            exit 1
          fi
          
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Versão final selecionada para deploy em produção: $APP_VERSION"

      - name: Replace Secrets in JSON Config
        id: replace_secrets
        env:
          APP_SECRETS: ${{ secrets.APP_SECRETS }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          CONFIG_PATH="infra/$ENV_NAME/config.json"
          JSON_CONFIG=$(cat "$CONFIG_PATH")
          
          echo "Replacing SECRET:: placeholders..."
          RESOLVED_JSON=$(echo "$JSON_CONFIG" | jq -c --argjson secrets "$APP_SECRETS" \
            ' .environment |= map(
                if .value | startswith("SECRET::") then
                  .value = ($secrets[.value[8:]] // "SECRET_NOT_FOUND")
                else
                  .
                end
              )')
          
          # Validar o resultado
          echo "$RESOLVED_JSON" | jq . >/dev/null || { echo "❌ JSON inválido após replace"; exit 1; }
          echo "✅ JSON válido após replace"

          # Converte para Base64 para transportar sem quebra de formato
          JSON_B64=$(echo "$RESOLVED_JSON" | base64 -w0 2>/dev/null || echo "$RESOLVED_JSON" | base64)
          echo "JSON_B64=$JSON_B64" >> $GITHUB_OUTPUT

      - name: Execute deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.vps-host }}
          username: ${{ secrets.vps-username }}
          key: ${{ secrets.vps-ssh-private-key }}
          script: |
            set -euo pipefail
            
            APP_VERSION="${{ steps.versioning.outputs.APP_VERSION }}"
            JSON_B64='${{ steps.replace_secrets.outputs.JSON_B64 }}'
            APP_NAME="${{ steps.json_config.outputs.APP_NAME }}"
            APP_PORT="${{ steps.json_config.outputs.APP_PORT }}"
            REPO_DOCKER="${{ secrets.docker-repo }}"
            IMAGE_NAME="$REPO_DOCKER/$APP_NAME:$APP_VERSION"
            
            echo "🚀 Iniciando o deploy Zero Downtime da versão: $APP_VERSION para a aplicação: $APP_NAME"
            
            if ! command -v jq &> /dev/null; then
                echo "jq não encontrado. Instalando..."
                sudo apt-get update && sudo apt-get install -y jq
            fi
            
            # Decodifica JSON
            JSON_CONFIG=$(echo "$JSON_B64" | base64 -d)
            
            # Extrai configs com fallback
            CPUS=$(echo "$JSON_CONFIG" | jq -r '.configContainer // {} | .cpus // "1.0"')
            MEMORY=$(echo "$JSON_CONFIG" | jq -r '.configContainer // {} | .memory // "800m"')
            MEMORY_SWAP=$(echo "$JSON_CONFIG" | jq -r '.configContainer // {} | .memorySwap // "1G"')
            
            echo "📦 Montando volumes (se houver)"
            DOCKER_VOLUMES=$(echo "$JSON_CONFIG" | jq -r '.volumes[]? | "-v \(. )"' 2>/dev/null | xargs || true)
            
            echo "✅ Config extraída:"
            echo "   CPUs: $CPUS"
            echo "   Memory: $MEMORY"
            echo "   Memory Swap: $MEMORY_SWAP"
            echo "   Volumes: ${DOCKER_VOLUMES:-Nenhum}"
            
            echo "📄 Criar arquivo .env temporário"
            TMP_DIR=$(mktemp -d)
            ENV_FILE="$TMP_DIR/$APP_NAME/${{ github.run_number }}/.env"
            mkdir -p $(dirname "$ENV_FILE")
            
            echo "$JSON_CONFIG" | jq -r '.environment[] | "\(.name)=\(.value)"' > "$ENV_FILE"
            
            echo "Conteúdo do arquivo .env:"
            awk -F= '{print $1 "=***"}' "$ENV_FILE"
            
            # Garantir que a rede Docker exista
            docker network inspect app-network >/dev/null 2>&1 || docker network create app-network

            # Puxar a nova imagem antes de qualquer ação para evitar lentidão
            echo "📥 Baixando nova imagem Docker..."
            docker pull "$IMAGE_NAME"

            # Identificar imagem em execução atualmente para possível rollback
            CURRENT_IMAGE_ID=$(docker inspect --format '{{.Image}}' "$APP_NAME" 2>/dev/null || true)

            # Estratégia Zero Downtime:
            # 1. Se contêiner já existe, validar o novo contêiner em porta de teste temporária
            TEST_PORT=18000
            TEST_CONTAINER="${APP_NAME}_staging"

            echo "🧪 Subindo contêiner de validação preliminar ($TEST_CONTAINER na porta $TEST_PORT:8080)..."
            docker rm -f "$TEST_CONTAINER" 2>/dev/null || true
            
            docker run -d \
              -p "${TEST_PORT}:8080" \
              --name "$TEST_CONTAINER" \
              --network app-network \
              --cpus="$CPUS" \
              --memory="$MEMORY" \
              --memory-swap="$MEMORY_SWAP" \
              --env-file "$ENV_FILE" \
              ${DOCKER_VOLUMES:-} \
              "$IMAGE_NAME"

            echo "⏳ Aguardando contêiner staging responder..."
            STAGING_UP=false
            for i in {1..30}; do
              sleep 3
              HEALTH_STATUS=$(curl -s "http://localhost:${TEST_PORT}/actuator/health" || curl -s "http://localhost:${TEST_PORT}/api/v1/health" || curl -s "http://localhost:${TEST_PORT}/health" || true)
              if echo "$HEALTH_STATUS" | grep -q '"status":"UP"'; then
                echo "✅ Staging validado com sucesso! ($HEALTH_STATUS)"
                STAGING_UP=true
                break
              fi
              echo "⚪️ Tentativa $i/30 aguardando staging..."
            done

            # Remove o container de teste imediatamente após a validação
            docker stop "$TEST_CONTAINER" 2>/dev/null || true
            docker rm "$TEST_CONTAINER" 2>/dev/null || true

            if [ "$STAGING_UP" != "true" ]; then
              echo "❌ Validação preliminar falhou! O novo container não está saudável."
              echo "O serviço atual em produção NÃO foi afetado (Zero Downtime preservado)."
              rm -rf "$TMP_DIR"
              exit 1
            fi

            # 2. Swap rápido e seguro: para antigo e sobe novo instantaneamente
            echo "🔄 Trocando contêiner de produção de forma rápida..."
            if [ "$(docker ps -q -f name=^/${APP_NAME}$)" ]; then
                docker stop "$APP_NAME"
                docker rename "$APP_NAME" "${APP_NAME}_old" || true
            fi

            echo "Iniciando contêiner oficial de produção..."
            docker run -d \
              -p "${APP_PORT}:8080" \
              --name "$APP_NAME" \
              --network app-network \
              --restart always \
              --cpus="$CPUS" \
              --memory="$MEMORY" \
              --memory-swap="$MEMORY_SWAP" \
              --env-file "$ENV_FILE" \
              ${DOCKER_VOLUMES:-} \
              "$IMAGE_NAME"

            rm -rf "$TMP_DIR"

            # 3. Health Check final em produção
            echo "🩺 Health Check em produção..."
            PROD_UP=false
            for i in {1..30}; do
              sleep 2
              HEALTH_STATUS=$(curl -s "http://localhost:${APP_PORT}/actuator/health" || curl -s "http://localhost:${APP_PORT}/api/v1/health" || curl -s "http://localhost:${APP_PORT}/health" || true)
              if echo "$HEALTH_STATUS" | grep -q '"status":"UP"'; then
                echo "✅ Aplicação está UP e saudável em produção!"
                PROD_UP=true
                break
              fi
              echo "⚪️ Tentativa $i/30: aguardando produção..."
            done

            if [ "$PROD_UP" = "true" ]; then
              echo "🧹 Removendo contêiner antigo de backup..."
              docker rm -f "${APP_NAME}_old" 2>/dev/null || true
              
              echo "🗑️ Removendo imagens antigas sem uso..."
              docker image prune -f || true
              echo "🚀 Deploy concluído com sucesso e Zero Downtime!"
              exit 0
            else
              echo "❌ Health check falhou em produção! Iniciando Rollback automático..."
              docker stop "$APP_NAME" 2>/dev/null || true
              docker rm "$APP_NAME" 2>/dev/null || true
              if [ "$(docker ps -a -q -f name=^/${APP_NAME}_old$)" ]; then
                docker rename "${APP_NAME}_old" "$APP_NAME"
                docker start "$APP_NAME"
                echo "⚠️ Rollback automático concluído: contêiner anterior restaurado!"
                sleep 2
                OLD_HEALTH=$(curl -s "http://localhost:${APP_PORT}/actuator/health" || curl -s "http://localhost:${APP_PORT}/health" || true)
                echo "🩺 Health status do contêiner restaurado: $OLD_HEALTH"
              fi
              exit 1
            fi

      - name: Create and Push Release Tag in GitHub
        if: success() && inputs.override_version == ''
        run: |
          APP_VERSION="${{ steps.versioning.outputs.APP_VERSION }}"
          TAG_NAME="v${APP_VERSION#v}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "Criando e enviando a tag $TAG_NAME para o repositório..."
          git tag -f "$TAG_NAME" -m "Release $APP_VERSION implantada com sucesso em produção"
          git push origin "$TAG_NAME" --force
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
