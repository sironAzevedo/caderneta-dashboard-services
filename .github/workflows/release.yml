name: "[RELEASE] - Build & Publish"

on:
  push:
    branches:
      - 'release/**'
      - 'release/*'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  build_and_publish:
    name: Build, Package and Publish Docker Image
    if: github.event.created != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if feature code has been merged into release branch
        run: |
          git fetch origin main
          if git diff --quiet origin/main HEAD; then
            echo "⚠️ A branch de release é idêntica à main (o PR da feature ainda não foi mesclado)."
            echo "Saindo sem executar o build."
            exit 0
          fi

      - name: Extract Release Version from Branch Name
        id: versioning
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          APP_VERSION="${BRANCH_NAME#release/}"
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Extraída versão da aplicação a partir da branch: ${APP_VERSION}"
          mvn versions:set -DnewVersion=$APP_VERSION

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Read config.json for production application name
        id: json_config
        run: |
          CONFIG_PATH="infra/prod/config.json"
          
          sudo apt-get update && sudo apt-get install -y jq
          APP_NAME=$(jq -r '.nameAPP' "$CONFIG_PATH")
          APP_PORT=$(jq -r '.port' "$CONFIG_PATH")
          
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "APP_PORT=${APP_PORT}" >> $GITHUB_OUTPUT

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>\${env.GITHUB_ACTOR}</username><password>\${env.GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Package with Maven
        run: mvn clean package -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify JAR file
        run: |
          echo "JAR file created:"
          ls -la target/*.jar
          echo "File size: $(du -h target/*.jar | cut -f1)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.REPO_DOCKER }}/${{ steps.json_config.outputs.APP_NAME }}:${{ steps.versioning.outputs.APP_VERSION }}
            ${{ secrets.REPO_DOCKER }}/${{ steps.json_config.outputs.APP_NAME }}:latest

      - name: Commit updated pom.xml version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): update pom.xml version to ${{ steps.versioning.outputs.APP_VERSION }} [ci skip]"
            git push origin HEAD:${GITHUB_REF}
          fi

      - name: Create Pull Request to Main via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          APP_VERSION="${{ steps.versioning.outputs.APP_VERSION }}"
          RELEASE_BRANCH="${GITHUB_REF_NAME}"
          
          echo "Abrindo PR de $RELEASE_BRANCH para main..."
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release ${APP_VERSION} -> main" \
            --body "Este PR mescla a release **${APP_VERSION}** na branch **main**." || true
