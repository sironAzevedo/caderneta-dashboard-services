name: "[CI] - Build e Test"

on:
  push:
    branches-ignore:
      - 'main'
      - 'develop'
      - 'release/**'
      - 'release/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    name: Compile application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>\${env.GITHUB_ACTOR}</username><password>\${env.GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: mvn clean install -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  test:
    name: Running tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>\${env.GITHUB_ACTOR}</username><password>\${env.GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run unit tests
        run: mvn test
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  create_pr_to_develop:
    name: Open PR to Develop
    runs-on: ubuntu-latest
    needs: [ compile, test ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Open PR to Develop via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          FEATURE_BRANCH="${{ github.ref_name }}"
          echo "Abrindo PR de $FEATURE_BRANCH para develop..."
          gh pr create \
            --base develop \
            --head "$FEATURE_BRANCH" \
            --title "PR: Merge ${FEATURE_BRANCH} -> develop" \
            --body "Este PR mescla as alterações de **${FEATURE_BRANCH}** na branch **develop**." || true
