name: "[DEVELOP] - Create Release PR"

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  compile:
    name: Compile application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>\${env.GITHUB_ACTOR}</username><password>\${env.GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: mvn clean install -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  test:
    name: Running tests
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>\${env.GITHUB_ACTOR}</username><password>\${env.GITHUB_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run unit tests
        run: mvn test
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  create_release_branch_and_pr:
    name: Create Release Branch and Open PR
    runs-on: ubuntu-latest
    needs: [ compile, test ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Determine Next Version from Docker Hub
        id: docker_version
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
          DOCKER_REPO: ${{ secrets.REPO_DOCKER }}
        run: |
          sudo apt-get update && sudo apt-get install -y jq curl
          
          APP_NAME=$(jq -r '.nameAPP' infra/prod/config.json)
          echo "App Name: $APP_NAME"
          
          LOGIN_RES=$(curl -s -H "Content-Type: application/json" -X POST -d "{\"username\": \"${DOCKER_USER}\", \"password\": \"${DOCKER_PASS}\"}" https://hub.docker.com/v2/users/login/)
          TOKEN=$(echo "$LOGIN_RES" | jq -r '.token // empty')
          
          HIGHEST_PATCH=0
          
          if [ -n "$TOKEN" ]; then
            TAGS_JSON=$(curl -s -H "Authorization: JWT ${TOKEN}" "https://hub.docker.com/v2/repositories/${DOCKER_REPO}/${APP_NAME}/tags?page_size=100")
            TAGS=$(echo "$TAGS_JSON" | jq -r '.results[]?.name // empty')
            
            for tag in $TAGS; do
              if [[ "$tag" =~ ^1\.0\.([0-9]+)$ ]]; then
                PATCH_NUM="${BASH_REMATCH[1]}"
                if (( PATCH_NUM > HIGHEST_PATCH )); then
                  HIGHEST_PATCH=$PATCH_NUM
                fi
              fi
            done
          fi
          
          NEXT_PATCH=$(( HIGHEST_PATCH + 1 ))

          # Checar Git Tags remotas (ex: v1.0.1, 1.0.1)
          GIT_TAG_PATCHES=$(git tag -l 2>/dev/null | grep -oE '1\.0\.[0-9]+' | cut -d'.' -f3 || true)
          for patch in $GIT_TAG_PATCHES; do
            if [ -n "$patch" ] && (( patch >= NEXT_PATCH )); then
              NEXT_PATCH=$(( patch + 1 ))
            fi
          done

          # Checar Branches de Release remotas (ex: origin/release/1.0.1)
          GIT_BRANCH_PATCHES=$(git branch -r 2>/dev/null | grep -oE 'release/1\.0\.[0-9]+' | cut -d'/' -f3 | cut -d'.' -f3 || true)
          for patch in $GIT_BRANCH_PATCHES; do
            if [ -n "$patch" ] && (( patch >= NEXT_PATCH )); then
              NEXT_PATCH=$(( patch + 1 ))
            fi
          done

          NEW_VERSION="1.0.${NEXT_PATCH}"
          RELEASE_BRANCH="release/${NEW_VERSION}"
          
          echo "NEW_VERSION=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Create Target Release Branch and Open PR via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RELEASE_BRANCH="${{ steps.docker_version.outputs.RELEASE_BRANCH }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH"; then
            echo "Branch $RELEASE_BRANCH já existe no remoto."
          else
            echo "Criando branch $RELEASE_BRANCH a partir da main..."
            git checkout -b "$RELEASE_BRANCH" origin/main
            git push origin "$RELEASE_BRANCH"
          fi
          
          echo "Abrindo PR de develop para $RELEASE_BRANCH..."
          gh pr create \
            --base "$RELEASE_BRANCH" \
            --head "develop" \
            --title "PR: Merge develop -> ${RELEASE_BRANCH}" \
            --body "Este PR mescla as alterações unificadas de **develop** na branch de release **${RELEASE_BRANCH}**." || true
